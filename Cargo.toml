[package]
name = "axon-stream-rs"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "axons"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
clap = { version = "4.6.3", features = ["env", "derive"] }
hex = { version = "0.4.3" }
hmac = { version = "0.13.0" }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
jwalk = { version = "0.8" }
mime_guess = { version = "2.0.5" }
percent-encoding = { version = "2.3.2" }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11.0" }
tar = { version = "0.4" }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["fs"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toasty = { version = "0.9", features = ["turso"] }
rust-embed = { version = "8.12.0", features = ["axum-ex", "mime-guess"] }

[build-dependencies]
walkdir = "2.5.0"
