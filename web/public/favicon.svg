<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- 背景渐变：shadcn 中性深色 zinc-950 -> zinc-900 -->
        <linearGradient id="axon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#09090B" />
            <stop offset="100%" stop-color="#18181B" />
        </linearGradient>
        <!-- 轴突信号渐变：zinc-400 -> zinc-50，克制的中性灰白 -->
        <linearGradient id="axon-signal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A1A1AA" />
            <stop offset="45%" stop-color="#D4D4D8" />
            <stop offset="100%" stop-color="#FAFAFA" />
        </linearGradient>
        <!-- 轻量阴影，替代原来的霓虹辉光 -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Favicon 圆角底座 -->
    <rect width="512" height="512" rx="112" fill="url(#axon-bg)" />
    <!-- 轴突主线条（形成字母 A 结构） -->
    <path d="M 155 375 C 155 260, 225 155, 256 120 C 287 155, 357 260, 357 375"
          fill="none"
          stroke="url(#axon-signal)"
          stroke-width="28"
          stroke-linecap="round" />
    <!-- 突触连接横桥 (形成 A 的横杠) -->
    <path d="M 195 295 Q 256 275 317 295"
          fill="none"
          stroke="url(#axon-signal)"
          stroke-width="22"
          stroke-linecap="round" />
    <!-- 节点 -->
    <!-- 1. 顶端主节点 -->
    <circle cx="256" cy="120" r="28" fill="#D4D4D8" filter="url(#glow)" />
    <circle cx="256" cy="120" r="12" fill="#FAFAFA" />
    <!-- 2. 左侧树突末端节点 -->
    <circle cx="155" cy="375" r="20" fill="#A1A1AA" />
    <circle cx="155" cy="375" r="8" fill="#FAFAFA" />
    <!-- 3. 右侧轴突末端节点 -->
    <circle cx="357" cy="375" r="22" fill="#71717A" filter="url(#glow)" />
    <circle cx="357" cy="375" r="10" fill="#D4D4D8" />
    <!-- 4. 横向传输中的电信号脉冲 -->
    <circle cx="256" cy="285" r="10" fill="#FAFAFA" filter="url(#glow)" />
</svg>
