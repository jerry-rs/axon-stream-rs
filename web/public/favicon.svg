<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- shadcn/ui zinc-950 背景底色 -->
  <rect width="32" height="32" rx="8" fill="#09090B" />

  <!-- 微弱网格/阴影质感边框 (可选 border) -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#27272A" stroke-width="1" />

  <!-- Axon 极简神经元 'A' 型脉络 -->
  <g transform="translate(4, 4)">
    <!-- 轴突支架 -->
    <path d="M4 21L12 4L20 21"
          fill="none"
          stroke="#FAFAFA"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 突触横梁 -->
    <path d="M8 14H16"
          fill="none"
          stroke="#FAFAFA"
          stroke-width="2"
          stroke-linecap="round" />

    <!-- 核心 Soma 节点 (点缀 shadcn 经典的 primary 高亮点) -->
    <circle cx="12" cy="4" r="2" fill="#18181B" stroke="#FAFAFA" stroke-width="1.5" />
    <circle cx="12" cy="14" r="1.5" fill="#FAFAFA" />
    <circle cx="4" cy="21" r="1.5" fill="#A1A1AA" />
    <circle cx="20" cy="21" r="1.5" fill="#A1A1AA" />
  </g>
</svg>
